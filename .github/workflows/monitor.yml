# Ejecución programada opcional.
#
# Este workflow NO notifica nada: solo ejecuta el motor y publica
# `opportunities.json` como artefacto descargable (y en la rama runtime-data si
# se habilita). Un superagente externo puede:
#   - descargar el artefacto `legosearch-data`,
#   - leer la rama `runtime-data` (recomendado si quieres histórico persistente),
#   - o subir/consumir el JSON desde su propio repositorio.
#
# Para activar el commit del histórico en una rama, quita el comentario del
# último paso y da permisos de escritura al GITHUB_TOKEN.
name: monitor-opportunities

on:
  # Escaneo automático DESACTIVADO a propósito: LegoSearch todavía no está
  # validado (ROI sin verificar, pocas oportunidades reales). Ejecuciones cada
  # 6 h solo acumularían ruido en el histórico.
  #
  # Para reactivarlo, descomenta las dos líneas siguientes:
  # schedule:
  #   - cron: "15 */6 * * *"
  #
  # Mientras tanto, el escaneo se lanza a mano (desde Actions o desde el
  # superagente vía workflow_dispatch).
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    # 15 min: deja margen para la pausa de 62 s entre subreddits (~2 min) y
    # las consultas a Brickset con la watchlist completa.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        run: python main.py
        env:
          # Opcional: sin esta clave la app usa los precios de config.py.
          # Añádela en Settings > Secrets and variables > Actions.
          BRICKSET_API_KEY: ${{ secrets.BRICKSET_API_KEY }}
          BRICKSET_USER_HASH: ${{ secrets.BRICKSET_USER_HASH }}

      - name: Show summary
        run: |
          python - <<'EOF'
          import json
          d = json.load(open("opportunities.json", encoding="utf-8"))
          r = d["resumen"]
          print(f"Nuevas: {r['nuevas_en_esta_ejecucion']} | Histórico: {r['total_historicas']}")
          for o in d["oportunidades"][:10]:
              f = o["financiero"]
              print(f"- [{o['referencia']}] {o['nombre']}: compra "
                    f"{f['precio_compra']} €, ROI {f['roi_pct']} %, score {o['score_total']}")
          EOF

      - name: Upload data artifact
        uses: actions/upload-artifact@v7
        with:
          name: legosearch-data
          path: |
            opportunities.json
            reports/
          retention-days: 90

      - name: Commit history to runtime-data branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Guardamos los ficheros recién generados ANTES de cambiar de rama:
          # "git checkout -f" sobrescribe el working tree y, sin esto, se
          # commiteaba el opportunities.json viejo de la rama.
          mkdir -p /tmp/out
          cp opportunities.json /tmp/out/
          CSFECHA="reports/oportunidades_$(date -u +%F).csv"
          [ -f "$CSFECHA" ] && cp "$CSFECHA" /tmp/out/oportunidades.csv

          # Si la rama ya existe, partimos de ella para acumular histórico.
          if git fetch origin runtime-data; then
            git checkout -f -B runtime-data origin/runtime-data
          else
            echo "runtime-data aun no existe: primera ejecución"
            git checkout --orphan runtime-data
            git rm -rf --cached .
          fi

          # Restauramos lo generado en esta ejecución (lo que haya en la rama
          # es el escaneo anterior; el de hoy manda).
          cp /tmp/out/opportunities.json opportunities.json
          [ -f /tmp/out/oportunidades.csv ] && cp /tmp/out/oportunidades.csv oportunidades.csv

          git add -f opportunities.json
          [ -f oportunidades.csv ] && git add -f oportunidades.csv

          git commit -m "chore: scan $(date -u +%FT%TZ)" || echo "No changes to commit"
          git push origin runtime-data
